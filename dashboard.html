<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | VehicleX</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav>
        <div class="logo-container">
            <i data-lucide="shield" class="logo-icon" style="width: 22px; height: 22px;"></i>
            <span class="logo-text">VehicleX</span>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="vendors.html"><i data-lucide="users"></i> Vendors</a></li>
            <li><a href="parts.html"><i data-lucide="package"></i> Parts</a></li>
            <li><a href="purchases.html"><i data-lucide="shopping-cart"></i> Purchases</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: white;">Admin User</div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
                        Manager</div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Inventory Dashboard</h1>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <i data-lucide="refresh-cw"></i> Refresh
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Vendors</div>
                <div id="stat-vendors" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Parts</div>
                <div id="stat-parts" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Purchase Invoices</div>
                <div id="stat-purchases" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Net Inventory Value</div>
                <div id="stat-value" class="stat-value">--</div>
            </div>
        </div>

        <div class="card-elegant">
            <div
                style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1);">
                <span style="font-size: 0.9rem; font-weight: 600; font-family: 'Outfit';">Recent Activity</span>
                <a href="purchases.html"
                    style="color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 500;">View
                    All</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Invoice Number</th>
                        <th>Purchase Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="recent-purchases-body">
                    <!-- Data injection -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            ui.refreshIcons();
            try {
                const [vResponse, pResponse, purResponse] = await Promise.all([
                    api.vendors.getAll(),
                    api.parts.getAll(),
                    api.purchases.getAll()
                ]);

                const vendors = vResponse.data || [];
                const parts = pResponse.data || [];
                const purchases = purResponse.data || [];

                document.getElementById('stat-vendors').textContent = vendors.length;
                document.getElementById('stat-parts').textContent = parts.length;
                document.getElementById('stat-purchases').textContent = purchases.length;

                const val = parts.reduce((acc, p) => acc + (p.price * p.stockQuantity), 0);
                document.getElementById('stat-value').textContent = `$${val.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;

                const tbody = document.getElementById('recent-purchases-body');
                if (purchases.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-dim); padding: 3rem;">No recent records.</td></tr>';
                } else {
                    purchases.slice(0, 8).forEach(pur => {
                        const row = `
                            <tr>
                                <td style="font-weight: 600;">${pur.invoiceNumber}</td>
                                <td style="color: var(--text-muted)">${new Date(pur.purchaseDate).toLocaleDateString()}</td>
                                <td>$${pur.totalAmount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                                <td><span style="color: var(--success); font-size: 0.75rem; font-weight: 600;">APPROVED</span></td>
                                <td style="color: var(--text-dim);">${pur.notes || '--'}</td>
                            </tr>
                        `;
                        tbody.insertAdjacentHTML('beforeend', row);
                    });
                }
            } catch (err) {
                ui.showToast('Data synchronization failed.', 'error');
            }
        });
    </script>
</body>

</html>
