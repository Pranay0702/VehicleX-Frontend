<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts | VehicleX</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="logo-container">
            <i data-lucide="shield" class="logo-icon" style="width: 22px; height: 22px;"></i>
            <span class="logo-text">VehicleX</span>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="vendors.html"><i data-lucide="users"></i> Vendors</a></li>
            <li><a href="parts.html" class="active"><i data-lucide="package"></i> Parts</a></li>
            <li><a href="purchases.html"><i data-lucide="shopping-cart"></i> Purchases</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">AD</div>
                <div>
                    <div style="font-size: 0.8rem; font-weight: 500; color: white;">Admin User</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Manager</div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Inventory Catalog</h1>
                <button class="btn btn-primary" onclick="showPartModal()">
                    <i data-lucide="plus"></i> Add Item
                </button>
            </div>
        </div>

        <div class="card-elegant">
            <table>
                <thead>
                    <tr>
                        <th>Part Identifier</th>
                        <th>Internal SKU</th>
                        <th>Preferred Vendor</th>
                        <th>Price</th>
                        <th>Availability</th>
                        <th style="width: 100px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="parts-body">
                    <!-- Data injection -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Part Modal -->
    <div id="part-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center;">
        <div class="modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="font-size: 1.25rem; font-weight: 600;" id="modal-title">Inventory Item</h2>
                <button class="btn btn-secondary" onclick="ui.hideModal('part-modal')" style="padding: 10px;">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="part-form">
                <input type="hidden" id="part-id">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label>Common Name</label>
                    <input type="text" id="part-name" required placeholder="e.g. Front Disc Brake">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
                    <div class="form-group">
                        <label>SKU Number</label>
                        <input type="text" id="part-number" required placeholder="UNQ-..." style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Vendor Partner</label>
                        <select id="vendor-id" required>
                            <option value="">-- Choose Partner --</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
                    <div class="form-group">
                        <label>Market Price ($)</label>
                        <input type="number" id="price" required step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Initial Quantity</label>
                        <input type="number" id="stock" required min="0" placeholder="0">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Technical Details</label>
                    <textarea id="description" placeholder="Notes & metadata..." style="min-height: 80px;"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <i data-lucide="archive"></i> Commit Item
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="ui.hideModal('part-modal')">Discard</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script>
        async function loadParts() {
            try {
                const response = await api.parts.getAll();
                const tbody = document.getElementById('parts-body');
                tbody.innerHTML = '';
                
                response.data.forEach(p => {
                    const row = `
                        <tr>
                            <td><span style="font-weight: 500; color: white;">${p.name}</span></td>
                            <td><code style="background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">${p.partNumber}</code></td>
                            <td style="color: var(--text-muted)">${p.vendorName}</td>
                            <td>$${p.price.toFixed(2)}</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                                        <div style="height: 100%; width: ${Math.min(100, (p.stockQuantity / 100) * 100)}%; background: ${p.stockQuantity < 10 ? 'var(--error)' : 'var(--accent)'}; border-radius: 10px;"></div>
                                    </div>
                                    <span style="font-weight: 600; color: ${p.stockQuantity < 10 ? 'var(--error)' : 'white'}">${p.stockQuantity}</span>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; gap: 0.5rem">
                                    <button class="btn btn-secondary" onclick="editPart(${p.id})" style="padding: 8px;">
                                        <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
                                    </button>
                                    <button class="btn btn-secondary" onclick="deletePart(${p.id})" style="padding: 8px; color: var(--error);">
                                        <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        async function loadVendors() {
            const select = document.getElementById('vendor-id');
            try {
                const response = await api.vendors.getAll();
                select.innerHTML = '<option value="">-- Choose Partner --</option>';
                response.data.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.textContent = v.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                ui.showToast('Could not fetch partners.', 'error');
            }
        }

        async function showPartModal() {
            await loadVendors();
            document.getElementById('modal-title').textContent = 'Inventory Record';
            document.getElementById('part-form').reset();
            document.getElementById('part-id').value = '';
            ui.showModal('part-modal');
            ui.refreshIcons();
        }

        async function editPart(id) {
            try {
                await loadVendors();
                const response = await api.parts.getById(id);
                const p = response.data;
                document.getElementById('modal-title').textContent = 'Modify Data';
                document.getElementById('part-id').value = p.id;
                document.getElementById('part-name').value = p.name;
                document.getElementById('part-number').value = p.partNumber;
                document.getElementById('vendor-id').value = p.vendorId;
                document.getElementById('price').value = p.price;
                document.getElementById('stock').value = p.stockQuantity;
                document.getElementById('description').value = p.description;
                ui.showModal('part-modal');
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        async function deletePart(id) {
            if (!confirm('Permanent inventory removal. Update catalog?')) return;
            try {
                await api.parts.delete(id);
                ui.showToast('Record deleted.');
                loadParts();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        document.getElementById('part-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('part-id').value;
            const data = {
                name: document.getElementById('part-name').value,
                partNumber: document.getElementById('part-number').value,
                vendorId: parseInt(document.getElementById('vendor-id').value),
                price: parseFloat(document.getElementById('price').value),
                stockQuantity: parseInt(document.getElementById('stock').value),
                description: document.getElementById('description').value
            };

            try {
                if (id) {
                    await api.parts.update(id, data);
                    ui.showToast('Catalog updated.');
                } else {
                    await api.parts.create(data);
                    ui.showToast('Entry logged.');
                }
                ui.hideModal('part-modal');
                loadParts();
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', loadParts);
    </script>
</body>
</html>
