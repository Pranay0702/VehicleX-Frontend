<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | VehicleX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav>
        <div class="logo-container">
            <a href="../index.html" style="display: block; width: 100%;">
                <img src="../assets/logo.png" alt="Logo" style="height: 180px;">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="customer-profile.html" class="active"><i data-lucide="user"></i> My Portal</a></li>
            <li><a href="../index.html"><i data-lucide="home"></i> Exit Portal</a></li>
        </ul>
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 1rem;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="avatar-initials"
                        style="width: 32px; height: 32px; background: var(--bg-hover); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff;">
                        CU</div>
                    <div>
                        <div id="customer-display-name" style="font-size: 0.75rem; font-weight: 600; color: #fff;">Customer</div>
                        <div style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Portal User</div>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="logoutCustomer()" style="width: 100%; border-color: var(--error); color: var(--error); padding: 8px;">
                <i data-lucide="log-out" style="width: 14px;"></i> Log Out
            </button>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">
                        Customer Dashboard</div>
                    <h1>Manage Profile & Vehicles</h1>
                </div>
            </div>
        </div>

        <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem;">Personal Profile Details</div>
        <div class="card-elegant" style="padding: 2rem; margin-bottom: 2.5rem;">
            <form id="profile-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="prof-name" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="text" id="prof-phone" required placeholder="Phone Number">
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" id="prof-email" required placeholder="Email Address">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="prof-address" placeholder="Address">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save" style="width: 14px;"></i> Save Changes
                </button>
            </form>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem;">
            <div style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">Registered Vehicles</div>
            <button class="btn btn-primary" onclick="showVehicleModal()">
                <i data-lucide="plus" style="width: 14px;"></i> Add Vehicle
            </button>
        </div>
        <div class="card-elegant">
            <table>
                <thead>
                    <tr>
                        <th>Vehicle Number</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Fuel Type</th>
                        <th>Year</th>
                        <th style="width: 120px; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="vehicles-body">
                    <!-- Injected via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Vehicle Modal -->
    <div id="vehicle-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
        <div class="modal">
            <h2 id="vehicle-modal-title">Add Vehicle</h2>
            <form id="vehicle-form">
                <input type="hidden" id="vehicle-id">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Vehicle Number *</label>
                    <input type="text" id="veh-number" required placeholder="e.g. BA 2 PA 1234">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label>Brand *</label>
                        <input type="text" id="veh-brand" required placeholder="e.g. Toyota">
                    </div>
                    <div class="form-group">
                        <label>Model *</label>
                        <input type="text" id="veh-model" required placeholder="e.g. Hilux">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem;">
                    <div class="form-group">
                        <label>Type / Fuel Type</label>
                        <input type="text" id="veh-fuel" placeholder="e.g. Diesel, Petrol, EV">
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="veh-year" min="1900" max="2100" placeholder="e.g. 2022">
                    </div>
                </div>
                <div style="display: flex; gap: 1px; background: var(--border-bright);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Save Vehicle
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="ui.hideModal('vehicle-modal')">
                        Discard
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js"></script>
    <script>
        let vehicles = [];

        function logoutCustomer() {
            api.customers.logout();
            window.location.href = 'login.html';
        }

        async function loadProfile() {
            try {
                // Fetch profile
                const response = await api.customers.getProfile();
                const data = response.data || response;

                document.getElementById('prof-name').value = data.fullName || '';
                document.getElementById('prof-phone').value = data.phoneNumber || '';
                document.getElementById('prof-email').value = data.email || '';
                document.getElementById('prof-address').value = data.address || '';

                // Set the header name
                document.getElementById('customer-display-name').textContent = data.fullName || 'Valued Customer';

                // Extract avatar initials
                const nameParts = (data.fullName || '').split(' ');
                const initials = nameParts.map(p => p[0]).join('').substring(0, 2).toUpperCase() || 'CU';
                document.getElementById('avatar-initials').textContent = initials;
            } catch (err) {
                if (err.message && err.message.toLowerCase().includes('unauthorized')) {
                    ui.showToast('Session expired or unauthorized. Logging out...', 'error');
                    logoutCustomer();
                } else {
                    ui.showToast(err.message || 'Failed to load profile.', 'error');
                }
            }
        }

        async function loadVehicles() {
            try {
                const response = await api.customers.getVehicles();
                vehicles = response.data || response || [];
                renderVehicles();
            } catch (err) {
                ui.showToast(err.message || 'Failed to load vehicles.', 'error');
            }
        }

        function renderVehicles() {
            const tbody = document.getElementById('vehicles-body');
            tbody.innerHTML = '';

            if (vehicles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="muted-empty">No vehicles registered yet. Add one to get started.</td></tr>';
                return;
            }

            vehicles.forEach(veh => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="mono" style="color: var(--accent); font-weight: 500;">${veh.vehicleNumber}</td>
                        <td>${veh.brand}</td>
                        <td>${veh.model}</td>
                        <td>${veh.fuelType || '--'}</td>
                        <td class="mono">${veh.year || '--'}</td>
                        <td style="text-align: right;">
                            <div style="display: flex; gap: 4px; justify-content: flex-end;">
                                <button class="btn btn-secondary" onclick="editVehicle(${veh.id})" style="padding: 6px;">
                                    <i data-lucide="edit-3" style="width: 12px; height: 12px;"></i>
                                </button>
                                <button class="btn btn-secondary" onclick="deleteVehicle(${veh.id})" style="padding: 6px; color: var(--error);">
                                    <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `);
            });

            ui.refreshIcons();
        }

        function showVehicleModal() {
            document.getElementById('vehicle-modal-title').textContent = 'Add Vehicle';
            document.getElementById('vehicle-form').reset();
            document.getElementById('vehicle-id').value = '';
            ui.showModal('vehicle-modal');
        }

        function editVehicle(id) {
            const veh = vehicles.find(v => v.id === id);
            if (!veh) return;

            document.getElementById('vehicle-modal-title').textContent = 'Update Vehicle';
            document.getElementById('vehicle-id').value = veh.id;
            document.getElementById('veh-number').value = veh.vehicleNumber;
            document.getElementById('veh-brand').value = veh.brand;
            document.getElementById('veh-model').value = veh.model;
            document.getElementById('veh-fuel').value = veh.fuelType || '';
            document.getElementById('veh-year').value = veh.year || '';

            ui.showModal('vehicle-modal');
        }

        async function deleteVehicle(id) {
            if (!confirm('Are you sure you want to delete this vehicle? This action cannot be undone.')) return;

            try {
                await api.customers.deleteVehicle(id);
                ui.showToast('Vehicle deleted successfully.');
                loadVehicles();
            } catch (err) {
                ui.showToast(err.message || 'Failed to delete vehicle.', 'error');
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                fullName: document.getElementById('prof-name').value.trim(),
                phoneNumber: document.getElementById('prof-phone').value.trim(),
                email: document.getElementById('prof-email').value.trim(),
                address: document.getElementById('prof-address').value.trim() || null
            };

            try {
                await api.customers.updateProfile(data);
                ui.showToast('Profile updated successfully.');
                loadProfile();
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg || 'Failed to update profile.', 'error');
            }
        });

        document.getElementById('vehicle-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('vehicle-id').value;
            const yearVal = document.getElementById('veh-year').value;
            const data = {
                vehicleNumber: document.getElementById('veh-number').value.trim(),
                brand: document.getElementById('veh-brand').value.trim(),
                model: document.getElementById('veh-model').value.trim(),
                fuelType: document.getElementById('veh-fuel').value.trim() || null,
                year: yearVal ? parseInt(yearVal) : null
            };

            try {
                if (id) {
                    await api.customers.updateVehicle(id, data);
                    ui.showToast('Vehicle updated successfully.');
                } else {
                    await api.customers.addVehicle(data);
                    ui.showToast('Vehicle added successfully.');
                }
                ui.hideModal('vehicle-modal');
                loadVehicles();
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg || 'Failed to save vehicle.', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Check auth token
            if (!localStorage.getItem('customerToken')) {
                window.location.href = 'login.html';
                return;
            }

            ui.refreshIcons();
            loadProfile();
            loadVehicles();
        });
    </script>
</body>

</html>
