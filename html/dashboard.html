<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | VehicleX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav>
        <div class="logo-container">
            <a href="../index.html" style="display: block; width: 100%;">
                <img src="../assets/logo.png" alt="Logo" style="height: 180px;">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="vendors.html"><i data-lucide="users"></i> Vendors</a></li>
            <li><a href="parts.html"><i data-lucide="package"></i> Parts</a></li>
            <li><a href="purchases.html"><i data-lucide="shopping-cart"></i> Purchases</a></li>
            <li><a href="customer-services.html"><i data-lucide="calendar-check"></i> Customer Services</a></li>
            <li><a href="staff.html"><i data-lucide="user-cog"></i> Staff</a></li>
        </ul>
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div
                    style="width: 32px; height: 32px; background: var(--bg-hover); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff;">
                    AD</div>
                <div>
                    <div style="font-size: 0.75rem; font-weight: 600; color: #fff;">Admin</div>
                    <div
                        style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
                        Manager</div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">
                        Inventory Overview</div>
                    <h1>System Dashboard</h1>
                </div>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <i data-lucide="refresh-cw" style="width: 14px;"></i> Sync Data
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Vendors</div>
                <div id="stat-vendors" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Parts</div>
                <div id="stat-parts" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Purchase Invoices</div>
                <div id="stat-purchases" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Inventory Value</div>
                <div id="stat-value" class="stat-value">--</div>
            </div>
        </div>

        <div
            style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem;">
            Recent Inbound Activity</div>
        <div class="card-elegant">
            <table>
                <thead>
                    <tr>
                        <th>Invoice Number</th>
                        <th>Purchase Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Internal Notes</th>
                    </tr>
                </thead>
                <tbody id="recent-purchases-body">
                    <!-- Data injection -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            ui.refreshIcons();
            try {
                const [vResponse, pResponse, purResponse] = await Promise.all([
                    api.vendors.getAll(),
                    api.parts.getAll(),
                    api.purchases.getAll()
                ]);

                const vendors = vResponse.data || [];
                const parts = pResponse.data || [];
                const purchases = purResponse.data || [];

                document.getElementById('stat-vendors').textContent = vendors.length;
                document.getElementById('stat-parts').textContent = parts.length;
                document.getElementById('stat-purchases').textContent = purchases.length;

                const val = parts.reduce((acc, p) => acc + (p.price * p.stockQuantity), 0);
                document.getElementById('stat-value').textContent = `NPR ${val.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;

                const tbody = document.getElementById('recent-purchases-body');
                if (purchases.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-dim); padding: 4rem; font-size: 0.8rem;">NO RECENT ACTIVITY LOGGED</td></tr>';
                } else {
                    purchases.slice(0, 10).forEach(pur => {
                        const row = `
                            <tr>
                                <td class="mono" style="color: var(--accent); font-weight: 500;">${pur.invoiceNumber}</td>
                                <td style="color: var(--text-muted)">${new Date(pur.purchaseDate).toLocaleDateString()}</td>
                                <td class="mono">NPR ${pur.totalAmount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                                <td><span style="font-size: 0.65rem; font-weight: 700; color: var(--success); border: 1px solid var(--success); padding: 2px 6px; text-transform: uppercase;">Finalized</span></td>
                                <td style="color: var(--text-dim); font-size: 0.8rem;">${pur.notes || '--'}</td>
                            </tr>
                        `;
                        tbody.insertAdjacentHTML('beforeend', row);
                    });
                }
            } catch (err) {
                ui.showToast('Data synchronization failed.', 'error');
            }
        });
    </script>
</body>

</html>
