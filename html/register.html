<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | VehicleX</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            min-height: 100vh;
            background-color: var(--bg-page);
        }

        .register-container {
            width: 100%;
            max-width: 650px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 2.5rem;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-header">
            <img src="../assets/logo.png" alt="Logo" style="height: 120px; margin-bottom: 1rem;">
            <div
                style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">
                Customer Portal</div>
            <h2>Self Registration</h2>
        </div>
        <form id="register-form">
            <div
                style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
                Personal Profile Details
            </div>
            <div class="form-grid" style="margin-bottom: 1.5rem;">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="cust-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <div style="position: relative; width: 100%;">
                        <span
                            style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; pointer-events: none; user-select: none;">+977</span>
                        <input type="text" id="cust-phone" required placeholder="98XXXXXXXX"
                            style="padding-left: 48px;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="cust-email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="cust-address" placeholder="e.g. Kathmandu, Nepal">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="password" required placeholder="At least 6 characters" minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="confirm-password" required placeholder="Re-enter password">
                </div>
            </div>

            <div
                style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 4px;">
                Vehicle Information
            </div>
            <div class="form-grid" style="margin-bottom: 2rem;">
                <div class="form-group">
                    <label>Vehicle Number *</label>
                    <input type="text" id="veh-number" required placeholder="e.g. BA 2 PA 1234">
                </div>
                <div class="form-group">
                    <label>Brand *</label>
                    <input type="text" id="veh-brand" required placeholder="e.g. Toyota">
                </div>
                <div class="form-group">
                    <label>Model *</label>
                    <input type="text" id="veh-model" required placeholder="e.g. Hilux">
                </div>
                <div class="form-group">
                    <label>Type / Fuel Type</label>
                    <input type="text" id="veh-fuel" placeholder="e.g. Diesel, Petrol, EV">
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="veh-year" min="1900" max="2100" placeholder="e.g. 2022">
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Register & Create Account
                </button>
                <div style="text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                    Already have an account? <a href="login.html"
                        style="color: var(--accent); text-decoration: none;">Log in here</a>
                </div>
                <div style="text-align: center; font-size: 0.8rem; margin-top: 1rem;">
                    <a href="../index.html"
                        style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Back to Hub
                    </a>
                </div>
            </div>
        </form>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            ui.refreshIcons();
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            let phone = document.getElementById('cust-phone').value.trim();
            if (phone && !phone.startsWith('+977')) {
                phone = '+977' + phone;
            }
            if (!ui.validateNepalPhone(phone)) {
                ui.showToast('Phone number must be a valid 10-digit Nepalese mobile number starting with 97 or 98 (e.g. 9841234567).', 'error');
                return;
            }

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                ui.showToast('Passwords do not match.', 'error');
                return;
            }

            const yearVal = document.getElementById('veh-year').value;
            const data = {
                fullName: document.getElementById('cust-name').value.trim(),
                phoneNumber: phone,
                email: document.getElementById('cust-email').value.trim(),
                password: password,
                address: document.getElementById('cust-address').value.trim() || null,
                vehicle: {
                    vehicleNumber: document.getElementById('veh-number').value.trim(),
                    brand: document.getElementById('veh-brand').value.trim(),
                    model: document.getElementById('veh-model').value.trim(),
                    fuelType: document.getElementById('veh-fuel').value.trim() || null,
                    year: yearVal ? parseInt(yearVal) : null
                }
            };

            try {
                const response = await api.customers.selfRegister(data);
                ui.showToast('Registration successful!', 'success');

                // Extract token safely
                let token = '';
                if (response.data && response.data.token) {
                    token = response.data.token;
                } else if (response.data && response.data.accessToken) {
                    token = response.data.accessToken;
                } else if (response.token) {
                    token = response.token;
                } else if (response.accessToken) {
                    token = response.accessToken;
                }

                if (token) {
                    localStorage.setItem('customerToken', token);
                    setTimeout(() => {
                        window.location.href = 'customer-profile.html';
                    }, 1000);
                } else {
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                }
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg || 'Registration failed.', 'error');
            }
        });
    </script>
</body>

</html>
