<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendors | VehicleX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav>
        <div class="logo-container">
            <a href="../index.html" style="display: block; width: 100%;">
                <img src="../assets/logo.png" alt="Logo" style="height: 180px;">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="vendors.html" class="active"><i data-lucide="users"></i> Vendors</a></li>
            <li><a href="parts.html"><i data-lucide="package"></i> Parts</a></li>
            <li><a href="purchases.html"><i data-lucide="shopping-cart"></i> Restock</a></li>
            <li><a href="sales.html"><i data-lucide="receipt"></i> Sales</a></li>
            <li><a href="customers.html"><i data-lucide="user"></i> Customers</a></li>
            <li><a href="customer-services.html"><i data-lucide="calendar-check"></i> Customer Services</a></li>
            <li><a href="staff.html"><i data-lucide="user-cog"></i> Staff</a></li>
        </ul>
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div
                    style="width: 32px; height: 32px; background: var(--bg-hover); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff;">
                    AD</div>
                <div>
                    <div style="font-size: 0.75rem; font-weight: 600; color: #fff;">Admin</div>
                    <div
                        style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
                        Manager</div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">
                        Supply Chain</div>
                    <h1>Vendor Directory</h1>
                </div>
                <button class="btn btn-primary" onclick="showVendorModal()">
                    <i data-lucide="plus" style="width: 14px;"></i> Register Partner
                </button>
            </div>
        </div>

        <div class="card-elegant">
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Primary Representative</th>
                        <th>Contact Email</th>
                        <th>Business Phone</th>
                        <th>Active SKUs</th>
                        <th style="width: 120px; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="vendors-body">
                    <!-- Data injection -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="vendor-modal" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
        <div class="modal">
            <h2 id="modal-title">Vendor Registration</h2>
            <form id="vendor-form">
                <input type="hidden" id="vendor-id">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Legal Entity Name</label>
                    <input type="text" id="name" required placeholder="e.g. Continental AG">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label>Account Manager</label>
                        <input type="text" id="contact" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Direct Phone</label>
                        <div style="position: relative; width: 100%;">
                            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; pointer-events: none; user-select: none;">+977</span>
                            <input type="text" id="phone" required placeholder="98XXXXXXXX" style="padding-left: 48px;">
                        </div>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Corporate Email</label>
                    <input type="email" id="email" required placeholder="procurement@vendor.com">
                </div>
                <div class="form-group" style="margin-bottom: 2.5rem;">
                    <label>Headquarters Address</label>
                    <textarea id="address" placeholder="Physical location details..."
                        style="min-height: 80px;"></textarea>
                </div>
                <div style="display: flex; gap: 1px; background: var(--border-bright);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Commit Records
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="ui.hideModal('vendor-modal')">
                        Discard
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js"></script>
    <script>
        async function loadVendors() {
            try {
                const response = await api.vendors.getAll();
                const tbody = document.getElementById('vendors-body');
                tbody.innerHTML = '';

                response.data.forEach(v => {
                    const row = `
                        <tr>
                            <td><span style="font-weight: 600; color: #fff;">${v.name}</span></td>
                            <td style="color: var(--text-muted)">${v.contactPerson}</td>
                            <td style="color: var(--accent); font-weight: 500;">${v.email}</td>
                            <td class="mono" style="font-size: 0.75rem;">${v.phone || '--'}</td>
                            <td>
                                <span class="mono" style="background: var(--bg-hover); padding: 4px 8px; border: 1px solid var(--border); font-size: 0.7rem;">${v.partsCount} SKUs</span>
                            </td>
                            <td style="text-align: right;">
                                <div style="display: flex; gap: 4px; justify-content: flex-end;">
                                    <button class="btn btn-secondary" onclick="editVendor(${v.id})" style="padding: 6px;">
                                        <i data-lucide="edit-3" style="width: 12px; height: 12px;"></i>
                                    </button>
                                    <button class="btn btn-secondary" onclick="deleteVendor(${v.id})" style="padding: 6px; color: var(--error);">
                                        <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message || 'Vendor sync failed.', 'error');
            }
        }

        function showVendorModal() {
            document.getElementById('modal-title').textContent = 'Vendor Registration';
            document.getElementById('vendor-form').reset();
            document.getElementById('vendor-id').value = '';
            ui.showModal('vendor-modal');
            ui.refreshIcons();
        }

        async function editVendor(id) {
            try {
                const response = await api.vendors.getById(id);
                const v = response.data;
                document.getElementById('modal-title').textContent = 'Update Profile';
                document.getElementById('vendor-id').value = v.id;
                document.getElementById('name').value = v.name;
                document.getElementById('contact').value = v.contactPerson;
                document.getElementById('email').value = v.email;
                let displayPhone = v.phone || '';
                if (displayPhone.startsWith('+977')) displayPhone = displayPhone.substring(4);
                document.getElementById('phone').value = displayPhone;
                document.getElementById('address').value = v.address;
                ui.showModal('vendor-modal');
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        async function deleteVendor(id) {
            if (!confirm('CONFIRM PERMANENT REMOVAL?')) return;
            try {
                await api.vendors.delete(id);
                ui.showToast('Profile purged.');
                loadVendors();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        document.getElementById('vendor-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            let phone = document.getElementById('phone').value.trim();
            if (phone && !phone.startsWith('+977')) {
                phone = '+977' + phone;
            }
            if (!ui.validateNepalPhone(phone)) {
                ui.showToast('Phone number must be a valid 10-digit Nepalese mobile number starting with 97 or 98 (e.g. 9841234567).', 'error');
                return;
            }

            const id = document.getElementById('vendor-id').value;
            const data = {
                name: document.getElementById('name').value,
                contactPerson: document.getElementById('contact').value,
                email: document.getElementById('email').value,
                phone: phone,
                address: document.getElementById('address').value
            };

            try {
                if (id) {
                    await api.vendors.update(id, data);
                    ui.showToast('Records updated.');
                } else {
                    await api.vendors.create(data);
                    ui.showToast('Registration complete.');
                }
                ui.hideModal('vendor-modal');
                loadVendors();
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (!api.auth.requireAdmin()) return;
            ui.setupStaffSidebar('vendors.html');
            loadVendors();
        });
    </script>
</body>

</html>
