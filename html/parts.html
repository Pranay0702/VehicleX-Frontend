<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts | VehicleX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav>
        <div class="logo-container">
            <img src="../assets/logo.png" alt="Logo" style="height: 180px;">

        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li><a href="vendors.html"><i data-lucide="users"></i> Vendors</a></li>
            <li><a href="parts.html" class="active"><i data-lucide="package"></i> Parts</a></li>
            <li><a href="purchases.html"><i data-lucide="shopping-cart"></i> Purchases</a></li>
        </ul>
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div
                    style="width: 32px; height: 32px; background: var(--bg-hover); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff;">
                    AD</div>
                <div>
                    <div style="font-size: 0.75rem; font-weight: 600; color: #fff;">Admin</div>
                    <div
                        style="font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
                        Manager</div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div
                        style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">
                        Inventory Catalog</div>
                    <h1>Master SKU Registry</h1>
                </div>
                <button class="btn btn-primary" onclick="showPartModal()">
                    <i data-lucide="plus" style="width: 14px;"></i> Add New Item
                </button>
            </div>
        </div>

        <div class="card-elegant">
            <table>
                <thead>
                    <tr>
                        <th>Part Identifier</th>
                        <th>Internal SKU</th>
                        <th>Source Vendor</th>
                        <th>MSRP (NPR)</th>
                        <th>Availability</th>
                        <th style="width: 120px; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="parts-body">
                    <!-- Data injection -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="part-modal" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
        <div class="modal">
            <h2 id="modal-title">Inventory Record</h2>
            <form id="part-form">
                <input type="hidden" id="part-id">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Common Item Name</label>
                    <input type="text" id="part-name" required placeholder="e.g. Fuel Injection Pump">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label>SKU Number</label>
                        <input type="text" id="part-number" required placeholder="VX-..." class="mono"
                            style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label>Preferred Partner</label>
                        <select id="vendor-id" required>
                            <option value="">-- Select Vendor --</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label>Unit Price (NPR)</label>
                        <input type="number" id="price" required step="0.01" min="0" placeholder="0.00" class="mono">
                    </div>
                    <div class="form-group">
                        <label>Initial Quantity</label>
                        <input type="number" id="stock" required min="0" placeholder="0" class="mono">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 2.5rem;">
                    <label>Technical Specifications</label>
                    <textarea id="description" placeholder="Notes, metadata, or compatibility..."
                        style="min-height: 80px;"></textarea>
                </div>
                <div style="display: flex; gap: 1px; background: var(--border-bright);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Commit Data
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="ui.hideModal('part-modal')">
                        Discard
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/api.js"></script>
    <script>
        async function loadParts() {
            try {
                const response = await api.parts.getAll();
                const tbody = document.getElementById('parts-body');
                tbody.innerHTML = '';

                response.data.forEach(p => {
                    const row = `
                        <tr>
                            <td><span style="font-weight: 600; color: #fff;">${p.name}</span></td>
                            <td class="mono" style="font-size: 0.75rem; color: var(--text-muted);">${p.partNumber}</td>
                            <td style="color: var(--text-muted)">${p.vendorName}</td>
                            <td class="mono">NPR ${p.price.toFixed(2)}</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 60px; height: 2px; background: var(--border); position: relative;">
                                        <div style="position: absolute; top: 0; left: 0; height: 100%; width: ${Math.min(100, (p.stockQuantity / 100) * 100)}%; background: ${p.stockQuantity < 10 ? 'var(--error)' : 'var(--accent)'};"></div>
                                    </div>
                                    <span class="mono" style="font-size: 0.8rem; font-weight: 600; color: ${p.stockQuantity < 10 ? 'var(--error)' : '#fff'}">${p.stockQuantity}</span>
                                </div>
                            </td>
                            <td style="text-align: right;">
                                <div style="display: flex; gap: 4px; justify-content: flex-end;">
                                    <button class="btn btn-secondary" onclick="editPart(${p.id})" style="padding: 6px;">
                                        <i data-lucide="edit-3" style="width: 12px; height: 12px;"></i>
                                    </button>
                                    <button class="btn btn-secondary" onclick="deletePart(${p.id})" style="padding: 6px; color: var(--error);">
                                        <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        async function loadVendors() {
            const select = document.getElementById('vendor-id');
            try {
                const response = await api.vendors.getAll();
                select.innerHTML = '<option value="">-- Select Vendor --</option>';
                response.data.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.id;
                    opt.textContent = v.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                ui.showToast('Partner sync failed.', 'error');
            }
        }

        async function showPartModal() {
            await loadVendors();
            document.getElementById('modal-title').textContent = 'Inventory Record';
            document.getElementById('part-form').reset();
            document.getElementById('part-id').value = '';
            ui.showModal('part-modal');
            ui.refreshIcons();
        }

        async function editPart(id) {
            try {
                await loadVendors();
                const response = await api.parts.getById(id);
                const p = response.data;
                document.getElementById('modal-title').textContent = 'Modify Record';
                document.getElementById('part-id').value = p.id;
                document.getElementById('part-name').value = p.name;
                document.getElementById('part-number').value = p.partNumber;
                document.getElementById('vendor-id').value = p.vendorId;
                document.getElementById('price').value = p.price;
                document.getElementById('stock').value = p.stockQuantity;
                document.getElementById('description').value = p.description;
                ui.showModal('part-modal');
                ui.refreshIcons();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        async function deletePart(id) {
            if (!confirm('CONFIRM PERMANENT PURGE?')) return;
            try {
                await api.parts.delete(id);
                ui.showToast('Item purged.');
                loadParts();
            } catch (err) {
                ui.showToast(err.message, 'error');
            }
        }

        document.getElementById('part-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('part-id').value;
            const data = {
                name: document.getElementById('part-name').value,
                partNumber: document.getElementById('part-number').value,
                vendorId: parseInt(document.getElementById('vendor-id').value),
                price: parseFloat(document.getElementById('price').value),
                stockQuantity: parseInt(document.getElementById('stock').value),
                description: document.getElementById('description').value
            };

            try {
                if (id) {
                    await api.parts.update(id, data);
                    ui.showToast('Records updated.');
                } else {
                    await api.parts.create(data);
                    ui.showToast('Entry logged.');
                }
                ui.hideModal('part-modal');
                loadParts();
            } catch (err) {
                const msg = err.errors?.length ? err.errors[0] : err.message;
                ui.showToast(msg, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', loadParts);
    </script>
</body>

</html>
